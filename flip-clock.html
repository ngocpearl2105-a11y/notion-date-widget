<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Aesthetic 3D Flip Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================================================
       1. THEME MÀU SẮC (LIGHT / DARK MODE)
       ========================================================= */
    :root {
      /* Mặc định: Nền card màu ĐEN, chữ TRẮNG */
      --card-bg: #0d0d0d;
      --text-color: #ffffff;
      --slit-line: rgba(255, 255, 255, 0.15);
      --slit-shadow: rgba(0, 0, 0, 0.65);
      --card-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Khi sang Dark mode: Nền card màu TRẮNG, chữ ĐEN */
        --card-bg: #ffffff;
        --text-color: #0d0d0d;
        --slit-line: rgba(0, 0, 0, 0.12);
        --slit-shadow: rgba(0, 0, 0, 0.08);
        --card-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
    }

    body.force-light {
      --card-bg: #0d0d0d !important;
      --text-color: #ffffff !important;
      --slit-line: rgba(255, 255, 255, 0.15) !important;
      --slit-shadow: rgba(0, 0, 0, 0.65) !important;
      --card-shadow: 0 6px 18px rgba(0, 0, 0, 0.25) !important;
    }

    body.force-dark {
      --card-bg: #ffffff !important;
      --text-color: #0d0d0d !important;
      --slit-line: rgba(0, 0, 0, 0.12) !important;
      --slit-shadow: rgba(0, 0, 0, 0.08) !important;
      --card-shadow: 0 6px 18px rgba(0, 0, 0, 0.3) !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
    }

    /* Container co giãn linh hoạt theo Notion Embed block */
    .clock-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      container-type: inline-size;
      cursor: pointer;
    }

    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5cqw;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1.55 / 1;
    }

    /* =========================================================
       2. CẤU TRÚC LẬT 3D (3D FLIP MECHANISM)
       ========================================================= */
    .card {
      position: relative;
      perspective: 800px;
      -webkit-perspective: 800px;
      border-radius: clamp(8px, 4.5cqw, 20px);
      box-shadow: var(--card-shadow);
    }

    .card-half {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      background: var(--card-bg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: background-color 0.25s ease;
    }

    .card-half.top {
      top: 0;
      height: 50%;
      border-radius: clamp(8px, 4.5cqw, 20px) clamp(8px, 4.5cqw, 20px) 0 0;
      transform-origin: bottom center;
      border-bottom: 0.5px solid var(--slit-line);
    }

    .card-half.bottom {
      bottom: 0;
      height: 50%;
      border-radius: 0 0 clamp(8px, 4.5cqw, 20px) clamp(8px, 4.5cqw, 20px);
      transform-origin: top center;
      border-top: 0.5px solid var(--slit-shadow);
    }

    /* Căn chỉnh số to tràn qua cả 2 nửa trên và dưới */
    .card-half.top .digit {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38cqw;
      line-height: 1;
      color: var(--text-color);
      letter-spacing: 0.02em;
      margin-top: 1cqw;
      transition: color 0.25s ease;
    }

    .card-half.bottom .digit {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38cqw;
      line-height: 1;
      color: var(--text-color);
      letter-spacing: 0.02em;
      margin-top: 1cqw;
      transition: color 0.25s ease;
    }

    /* Chữ phụ (AM/PM và Thứ) */
    .sub-text {
      position: absolute;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: clamp(8px, 3.8cqw, 15px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-color);
      z-index: 10;
      transition: color 0.25s ease;
    }

    .am-pm {
      bottom: clamp(6px, 3.2cqw, 14px);
      left: clamp(8px, 4cqw, 16px);
    }

    .day-name {
      bottom: clamp(6px, 3.2cqw, 14px);
      right: clamp(8px, 4cqw, 16px);
      text-transform: uppercase;
    }

    /* Thứ tự phân lớp các cánh lật */
    .static.top { z-index: 1; }
    .static.bottom { z-index: 1; }
    .flap-bottom { z-index: 2; transform: rotateX(90deg); }
    .flap-top { z-index: 3; transform: rotateX(0deg); }

    /* Lớp phủ bóng đổ (Shading) khi lá bài lật qua góc ánh sáng */
    .card-half::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* =========================================================
       3. ANIMATION LẬT 3D & ĐỔ BÓNG
       ========================================================= */
    .card.flipping .flap-top {
      animation: flip-down-top 0.3s cubic-bezier(0.37, 0, 0.63, 1) forwards;
    }

    .card.flipping .flap-top::after {
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      animation: shadow-in 0.3s ease-in forwards;
    }

    .card.flipping .flap-bottom {
      animation: flip-down-bottom 0.3s cubic-bezier(0.15, 0.45, 0.28, 1) 0.28s forwards;
    }

    .card.flipping .flap-bottom::after {
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      animation: shadow-out 0.3s ease-out 0.28s forwards;
    }

    @keyframes flip-down-top {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }

    @keyframes flip-down-bottom {
      0% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    @keyframes shadow-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes shadow-out {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="clock-wrapper" id="clockWidget" title="Nhấp 1 lần để test lật số | Nhấp đúp để đổi sáng/tối">
    <div class="clock-grid">
      <!-- Thẻ Giờ -->
      <div class="card" id="cardHours">
        <div class="card-half top static"><div class="digit">10</div></div>
        <div class="card-half bottom static">
          <div class="digit">10</div>
          <span class="sub-text am-pm">AM</span>
        </div>
        <div class="card-half top flap-top"><div class="digit">10</div></div>
        <div class="card-half bottom flap-bottom">
          <div class="digit">10</div>
          <span class="sub-text am-pm">AM</span>
        </div>
      </div>

      <!-- Thẻ Phút -->
      <div class="card" id="cardMinutes">
        <div class="card-half top static"><div class="digit">23</div></div>
        <div class="card-half bottom static">
          <div class="digit">23</div>
          <span class="sub-text day-name">FRIDAY</span>
        </div>
        <div class="card-half top flap-top"><div class="digit">23</div></div>
        <div class="card-half bottom flap-bottom">
          <div class="digit">23</div>
          <span class="sub-text day-name">FRIDAY</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentHours = '';
    let currentMinutes = '';

    // Hàm xử lý lật thẻ 3D
    function flipCard(cardEl, newValue, subSelector, subValue) {
      const topStatic = cardEl.querySelector('.top.static .digit');
      const bottomStatic = cardEl.querySelector('.bottom.static .digit');
      const flapTop = cardEl.querySelector('.flap-top');
      const flapBottom = cardEl.querySelector('.flap-bottom');
      const flapTopDigit = flapTop.querySelector('.digit');
      const flapBottomDigit = flapBottom.querySelector('.digit');

      const currentValue = bottomStatic.textContent;
      if (currentValue === newValue && !cardEl.dataset.forceFlip) return;
      delete cardEl.dataset.forceFlip;

      // Cập nhật chữ phụ (AM/PM hoặc Thứ)
      if (subSelector && subValue) {
        cardEl.querySelectorAll(subSelector).forEach(el => el.textContent = subValue);
      }

      // Nạp giá trị cho các lớp trước và sau
      topStatic.textContent = newValue;
      flapTopDigit.textContent = currentValue;
      flapBottomDigit.textContent = newValue;
      bottomStatic.textContent = currentValue;

      // Kích hoạt lại animation mượt mà
      cardEl.classList.remove('flipping');
      void cardEl.offsetWidth; // Force CSS reflow
      cardEl.classList.add('flipping');

      const handleAnimEnd = (e) => {
        if (e.target === flapBottom) {
          bottomStatic.textContent = newValue;
          flapTopDigit.textContent = newValue;
          cardEl.classList.remove('flipping');
          flapBottom.removeEventListener('animationend', handleAnimEnd);
        }
      };
      flapBottom.addEventListener('animationend', handleAnimEnd);
    }

    // Lấy thời gian từ máy tính user và cập nhật
    function updateTime(force = false) {
      const now = new Date();
      let rawHours = now.getHours();
      const minutes = now.getMinutes();
      const ampm = rawHours >= 12 ? 'PM' : 'AM';

      let hours = rawHours % 12;
      hours = hours ? hours : 12;

      const hoursStr = String(hours).padStart(2, '0');
      const minutesStr = String(minutes).padStart(2, '0');

      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const dayStr = days[now.getDay()];

      const cardHours = document.getElementById('cardHours');
      const cardMinutes = document.getElementById('cardMinutes');

      if (force || currentHours === '') {
        cardHours.dataset.forceFlip = 'true';
        cardMinutes.dataset.forceFlip = 'true';
      }

      if (hoursStr !== currentHours || force) {
        flipCard(cardHours, hoursStr, '.am-pm', ampm);
        currentHours = hoursStr;
      }

      if (minutesStr !== currentMinutes || force) {
        flipCard(cardMinutes, minutesStr, '.day-name', dayStr);
        currentMinutes = minutesStr;
      }
    }

    // Xử lý tham số theme từ URL (?theme=light hoặc ?theme=dark)
    const urlParams = new URLSearchParams(window.location.search);
    const themeParam = urlParams.get('theme');
    if (themeParam === 'light') document.body.classList.add('force-light');
    if (themeParam === 'dark') document.body.classList.add('force-dark');

    // Tương tác chuột
    const widget = document.getElementById('clockWidget');
    
    // Nhấp 1 lần: kích hoạt lật số tức thì để test
    widget.addEventListener('click', () => {
      updateTime(true);
    });

    // Nhấp đúp (Double click): Đổi qua lại giữa màu Sáng / Tối
    widget.addEventListener('dblclick', () => {
      const isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const currentDark = document.body.classList.contains('force-dark') || 
                          (!document.body.classList.contains('force-light') && isSystemDark);

      if (currentDark) {
        document.body.classList.remove('force-dark');
        document.body.classList.add('force-light');
      } else {
        document.body.classList.remove('force-light');
        document.body.classList.add('force-dark');
      }
    });

    // Chạy khởi động sau 150ms để mắt thấy rõ nhịp lật đầu tiên
    setTimeout(() => updateTime(true), 150);
    setInterval(() => updateTime(false), 1000);
  </script>
</body>
</html>
