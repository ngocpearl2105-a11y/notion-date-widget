<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: transparent;
      --text-color: #8c3b3b;
      --subtext-color: #9c5050;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #191919;
        --text-color: #e5989b;
        --subtext-color: #d68084;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;       /* Locks to vertical center */
      justify-content: center;   /* Locks to horizontal center */
      overflow: hidden;
      user-select: none;
    }

    .date-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .day-name {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 500;
      color: var(--subtext-color);
      text-transform: uppercase;
    }

    .day-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 56px;
      line-height: 1;
      font-weight: 400;
      color: var(--text-color);
      margin: 4px 0;
    }

    .month-year {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      font-weight: 500;
      color: var(--subtext-color);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="date-card">
    <div id="day-name" class="day-name">---</div>
    <div id="day-number" class="day-number">--</div>
    <div id="month-year" class="month-year">--- ----</div>
  </div>

  <script>
    const now = new Date();
    const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    
    document.getElementById('day-name').textContent = days[now.getDay()];
    document.getElementById('day-number').textContent = now.getDate();
    document.getElementById('month-year').textContent = `${now.toLocaleString('en-US', { month: 'short' }).toUpperCase()} ${now.getFullYear()}`;
  </script>
</body>
</html>
