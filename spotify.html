<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Aesthetic Spotify Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-card: #181818;
      --text-main: #ffffff;
      --text-sub: #a7a7a7;
      --progress-bg: #4d4d4d;
      --progress-fill: #ffffff;
      --track-hover: rgba(255, 255, 255, 0.08);
      --card-radius: 16px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 4px;
      overflow: hidden;
    }

    .player-card {
      width: 100%;
      max-width: 320px;
      background: var(--bg-card);
      border-radius: var(--card-radius);
      padding: 14px;
      color: var(--text-main);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Khung ảnh Manga/Anime */
    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #282828;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
    }

    /* Icon Spotify góc trên bên phải ảnh */
    .spotify-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .spotify-badge:hover {
      transform: scale(1.1);
    }
    .spotify-badge svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    /* Thông tin bài hát & Tim */
    .song-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .song-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }
    .artist-name {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: transform 0.15s ease;
    }
    .heart-btn:hover { transform: scale(1.15); }
    .heart-btn.liked svg { fill: #ffffff; }

    /* Thanh tiến trình (Progress Bar) */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--progress-bg);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      width: 15%;
      height: 100%;
      background: var(--progress-fill);
      border-radius: 2px;
      position: relative;
    }
    .progress-knob {
      position: absolute;
      right: -4px;
      top: -3px;
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .progress-bar-container:hover .progress-knob { opacity: 1; }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-sub);
    }

    /* Bộ điều khiển (Controls) */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, transform 0.15s ease;
    }
    .ctrl-btn:hover { color: var(--text-main); }
    .play-btn {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover {
      transform: scale(1.08);
      color: #000000;
    }

    /* Danh sách bài hát (Tracklist) */
    .tracklist {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s ease;
    }
    .track-item:hover { background: var(--track-hover); }
    .track-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }
    .track-num {
      color: var(--text-sub);
      font-size: 11px;
      width: 14px;
    }
    .track-artist {
      color: var(--text-sub);
    }
    .dots-menu {
      color: var(--text-sub);
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Audio phát nhạc lofi thư giãn trực tiếp -->
  <audio id="audioPlayer" loop src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

  <div class="player-card">
    <!-- Ảnh bìa Anime/Manga kèm logo Spotify -->
    <div class="cover-container">
      <img class="cover-img" id="coverImg" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80" alt="Album Cover">
      <a class="spotify-badge" href="https://open.spotify.com" target="_blank" title="Mở Spotify">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.315c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.65-1.168-.41.094-.816-.164-.91-.574-.094-.41.164-.816.574-.91 4.62-1.055 8.57-.614 11.77 1.36.358.218.472.68.254 1.038zm1.47-3.265c-.275.448-.86.59-1.308.315-3.26-2.003-8.23-2.584-12.083-1.414-.505.153-1.04-.135-1.193-.64-.153-.505.135-1.04.64-1.193 4.397-1.334 9.877-.69 13.63 1.624.448.275.59.86.315 1.308zm.126-3.41c-3.91-2.322-10.354-2.535-14.086-1.402-.6.182-1.237-.16-1.42-.76-.182-.6.16-1.237.76-1.42 4.29-1.302 11.41-1.055 15.918 1.62.54.32.716 1.02.395 1.56-.32.54-1.02.716-1.56.395z"/></svg>
      </a>
    </div>

    <!-- Tên bài hát & nút Thả tim -->
    <div class="song-info">
      <div>
        <div class="song-title" id="songTitle">Lofi Beats</div>
        <div class="artist-name" id="artistName">chill</div>
      </div>
      <button class="heart-btn" id="heartBtn" title="Like">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      </button>
    </div>

    <!-- Thanh tiến trình phát -->
    <div class="progress-section">
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-fill" id="progressFill"><span class="progress-knob"></span></div>
      </div>
      <div class="time-labels">
        <span id="currentTime">0:03</span>
        <span id="durationTime">-2:38</span>
      </div>
    </div>

    <!-- Cụm nút điều khiển -->
    <div class="controls">
      <button class="ctrl-btn" title="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
      <button class="ctrl-btn" id="prevBtn" title="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg></button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg></button>
      <button class="ctrl-btn" title="Repeat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
    </div>

    <!-- Danh sách bài hát (Tracklist) -->
    <div class="tracklist">
      <div class="track-item" onclick="switchTrack('Lofi Beats', 'chill')">
        <div class="track-left"><span class="track-num">1</span><span>Lofi Beats</span><span class="track-artist">- chill</span></div>
        <span class="dots-menu">•••</span>
      </div>
      <div class="track-item" onclick="switchTrack('Midnight Study', 'lofi girl')">
        <div class="track-left"><span class="track-num">2</span><span>Midnight Study</span><span class="track-artist">- lofi girl</span></div>
        <span class="dots-menu">•••</span>
      </div>
      <div class="track-item" onclick="switchTrack('Coffee & Rain', 'aesthetic')">
        <div class="track-left"><span class="track-num">3</span><span>Coffee & Rain</span><span class="track-artist">- aesthetic</span></div>
        <span class="dots-menu">•••</span>
      </div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const heartBtn = document.getElementById('heartBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    let isPlaying = false;
    let timer = 3;

    // Nút Play / Pause
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        isPlaying = false;
      } else {
        audio.play().catch(() => {});
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        isPlaying = true;
      }
    });

    // Cập nhật tiến trình chạy giả lập nếu stream online
    setInterval(() => {
      if (isPlaying) {
        timer++;
        const mins = Math.floor(timer / 60);
        const secs = String(timer % 60).padStart(2, '0');
        currentTimeEl.textContent = `${mins}:${secs}`;
        const pct = Math.min(100, (timer / 180) * 100);
        progressFill.style.width = pct + '%';
      }
    }, 1000);

    // Nút Like
    heartBtn.addEventListener('click', () => {
      heartBtn.classList.toggle('liked');
    });

    // Đổi bài khi click danh sách
    function switchTrack(title, artist) {
      document.getElementById('songTitle').textContent = title;
      document.getElementById('artistName').textContent = artist;
      timer = 0;
      if (!isPlaying) playBtn.click();
    }
  </script>
</body>
</html>
