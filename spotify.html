<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Aesthetic Spotify Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    /* DEFAULT RESPONSIVE THEME (No shadow, border only) */
    :root {
      /* Light Mode Default: Black card, White text */
      --bg-card: #121212;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --border-color: rgba(0, 0, 0, 0.14);
      --progress-bg: rgba(255, 255, 255, 0.22);
      --track-hover: rgba(255, 255, 255, 0.08);
      --divider: rgba(255, 255, 255, 0.1);
      --card-radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Default: White card, Black text */
        --bg-card: #ffffff;
        --text-main: #121212;
        --text-sub: #666666;
        --border-color: rgba(255, 255, 255, 0.2);
        --progress-bg: rgba(0, 0, 0, 0.15);
        --track-hover: rgba(0, 0, 0, 0.05);
        --divider: rgba(0, 0, 0, 0.08);
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 4px;
      overflow: hidden;
    }

    /* NO SHADOW - BORDER ONLY */
    .player-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: var(--bg-card);
      border-radius: var(--card-radius);
      border: 1px solid var(--border-color);
      box-shadow: none !important;
      padding: 14px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    /* Settings Gear Button (Shows on hover) */
    .settings-btn {
      position: absolute;
      top: 22px;
      left: 22px;
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      cursor: pointer;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .player-card:hover .settings-btn { opacity: 1; }
    .settings-btn:hover { transform: scale(1.1); background: rgba(0, 0, 0, 0.85); }

    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #242424;
      border: 1px solid var(--divider);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
    }

    .spotify-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 4;
      transition: transform 0.2s ease;
    }
    .spotify-badge:hover { transform: scale(1.12); }
    .spotify-badge svg { width: 18px; height: 18px; fill: #ffffff; }

    .song-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .song-title-group { overflow: hidden; cursor: pointer; }
    .song-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist-name {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .heart-btn.liked svg { fill: currentColor; }

    .progress-section { display: flex; flex-direction: column; gap: 4px; }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--progress-bg);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      width: 18%;
      height: 100%;
      background: var(--text-main);
      border-radius: 2px;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-sub);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { color: var(--text-main); }
    .play-btn {
      width: 40px;
      height: 40px;
      background: var(--text-main);
      border-radius: 50%;
      color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { transform: scale(1.06); color: var(--bg-card); }

    .tracklist {
      border-top: 1px solid var(--divider);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .track-item:hover { background: var(--track-hover); }
    .track-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      overflow: hidden;
    }
    .track-num { color: var(--text-sub); font-size: 11px; width: 14px; }
    .track-artist { color: var(--text-sub); }
    .dots-menu { color: var(--text-sub); font-size: 12px; }

    /* MODAL SETTINGS */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 18, 0.98);
      backdrop-filter: blur(8px);
      border-radius: var(--card-radius);
      z-index: 100;
      padding: 14px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }
    .modal-overlay.active { display: flex; }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 6px;
    }
    .modal-title { font-size: 13px; font-weight: 700; }
    .close-btn { background: none; border: none; color: #a7a7a7; font-size: 18px; cursor: pointer; }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 6px 0;
      overflow-y: auto;
    }
    .input-group { display: flex; flex-direction: column; gap: 2px; }
    .input-group label { font-size: 10.5px; font-weight: 600; color: #b0b0b0; }
    .input-group input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #3e3e3e;
      border-radius: 5px;
      color: #ffffff;
      padding: 5px 8px;
      font-size: 11.5px;
      outline: none;
    }
    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .color-box { display: flex; flex-direction: column; gap: 3px; }
    .color-box label { font-size: 10px; font-weight: 600; color: #b0b0b0; }
    .color-pair { display: flex; align-items: center; gap: 4px; }
    .color-pair input[type="color"] { width: 22px; height: 22px; border: none; background: none; cursor: pointer; }
    .color-pair input[type="text"] {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3e3e3e;
      border-radius: 4px;
      color: #fff;
      padding: 3px 5px;
      font-size: 11px;
      font-family: monospace;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 8px;
      gap: 4px;
    }
    .btn-group { display: flex; gap: 5px; }
    .btn-action {
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save { background: #ffffff; color: #000000; }
    .btn-copy { background: #333333; color: #ffffff; border: 1px solid #555; }
    .btn-reset { background: none; color: #e05656; border: none; font-size: 10.5px; cursor: pointer; }
  </style>
</head>
<body>

  <audio id="audioPlayer" loop src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

  <div class="player-card">
    <button class="settings-btn" id="openSettingsBtn" title="Widget Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>

    <div class="cover-container">
      <img class="cover-img" id="coverImg" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80" alt="Cover">
      <a class="spotify-badge" id="spotifyLink" href="https://open.spotify.com" target="_blank" title="Open on Spotify">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.315c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.65-1.168-.41.094-.816-.164-.91-.574-.094-.41.164-.816.574-.91 4.62-1.055 8.57-.614 11.77 1.36.358.218.472.68.254 1.038zm1.47-3.265c-.275.448-.86.59-1.308.315-3.26-2.003-8.23-2.584-12.083-1.414-.505.153-1.04-.135-1.193-.64-.153-.505.135-1.04.64-1.193 4.397-1.334 9.877-.69 13.63 1.624.448.275.59.86.315 1.308zm.126-3.41c-3.91-2.322-10.354-2.535-14.086-1.402-.6.182-1.237-.16-1.42-.76-.182-.6.16-1.237.76-1.42 4.29-1.302 11.41-1.055 15.918 1.62.54.32.716 1.02.395 1.56-.32.54-1.02.716-1.56.395z"/></svg>
      </a>
    </div>

    <div class="song-info">
      <div class="song-title-group" id="titleGroup" title="Click to open on Spotify">
        <div class="song-title" id="songTitle">Lofi Beats</div>
        <div class="artist-name" id="artistName">chill</div>
      </div>
      <button class="heart-btn" id="heartBtn" title="Like">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      </button>
    </div>

    <div class="progress-section">
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-labels">
        <span id="currentTime">0:03</span>
        <span>-2:38</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
      <button class="ctrl-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg></button>
      <button class="ctrl-btn play-btn" id="playBtn">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
      <button class="ctrl-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg></button>
      <button class="ctrl-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
    </div>

    <div class="tracklist">
      <div class="track-item" onclick="switchTrack('Lofi Beats', 'chill')">
        <div class="track-left"><span class="track-num">1</span><span>Lofi Beats</span><span class="track-artist">- chill</span></div>
        <span class="dots-menu">•••</span>
      </div>
      <div class="track-item" onclick="switchTrack('Midnight Study', 'lofi girl')">
        <div class="track-left"><span class="track-num">2</span><span>Midnight Study</span><span class="track-artist">- lofi girl</span></div>
        <span class="dots-menu">•••</span>
      </div>
      <div class="track-item" onclick="switchTrack('Coffee & Rain', 'aesthetic')">
        <div class="track-left"><span class="track-num">3</span><span>Coffee & Rain</span><span class="track-artist">- aesthetic</span></div>
        <span class="dots-menu">•••</span>
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-header">
        <div class="modal-title">⚙️ Player & Color Settings</div>
        <button class="close-btn" id="closeSettingsBtn">✕</button>
      </div>

      <div class="modal-body">
        <div class="input-group">
          <label>Spotify Playlist URL:</label>
          <input type="text" id="inputSpotifyUrl" placeholder="https://open.spotify.com/playlist/...">
        </div>
        <div class="input-group">
          <label>Track Title & Artist:</label>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px;">
            <input type="text" id="inputSongTitle" placeholder="Lofi Beats">
            <input type="text" id="inputArtistName" placeholder="chill">
          </div>
        </div>
        <div class="input-group">
          <label>Cover Image URL:</label>
          <input type="text" id="inputCoverUrl" placeholder="https://...">
        </div>

        <div class="color-grid">
          <div class="color-box">
            <label>Card Background:</label>
            <div class="color-pair">
              <input type="color" id="pickerBg" value="#121212">
              <input type="text" id="hexBg" value="#121212" maxlength="7">
            </div>
          </div>
          <div class="color-box">
            <label>Text & Accents:</label>
            <div class="color-pair">
              <input type="color" id="pickerText" value="#ffffff">
              <input type="text" id="hexText" value="#ffffff" maxlength="7">
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-reset" id="resetBtn">Auto Default</button>
        <div class="btn-group">
          <button class="btn-action btn-copy" id="copyUrlBtn" title="Copy URL with settings for Template">📋 Copy Template URL</button>
          <button class="btn-action btn-save" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'notion_spotify_widget_v2';
    const urlParams = new URLSearchParams(window.location.search);

    const DEFAULTS = {
      spotifyUrl: 'https://open.spotify.com',
      title: 'Lofi Beats',
      artist: 'chill',
      cover: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80',
      bg: null,
      text: null
    };

    function normalizeHex(val) {
      if (!val) return null;
      val = val.trim().replace(/^#/, '');
      if (/^[0-9A-Fa-f]{6}$/.test(val)) return '#' + val;
      return null;
    }

    function getActiveConfig() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

      const fromUrl = {
        spotifyUrl: urlParams.get('spotify') || DEFAULTS.spotifyUrl,
        title: urlParams.get('title') || DEFAULTS.title,
        artist: urlParams.get('artist') || DEFAULTS.artist,
        cover: urlParams.get('cover') || DEFAULTS.cover,
        bg: normalizeHex(urlParams.get('bg')),
        text: normalizeHex(urlParams.get('text'))
      };

      return saved ? { ...fromUrl, ...saved } : fromUrl;
    }

    function applyConfig(cfg) {
      document.getElementById('songTitle').textContent = cfg.title || DEFAULTS.title;
      document.getElementById('artistName').textContent = cfg.artist || DEFAULTS.artist;
      document.getElementById('spotifyLink').href = cfg.spotifyUrl || DEFAULTS.spotifyUrl;
      document.getElementById('coverImg').src = cfg.cover || DEFAULTS.cover;

      document.getElementById('titleGroup').onclick = () => {
        if (cfg.spotifyUrl) window.open(cfg.spotifyUrl, '_blank');
      };

      const root = document.documentElement;
      if (cfg.bg && cfg.text) {
        root.style.setProperty('--bg-card', cfg.bg);
        root.style.setProperty('--text-main', cfg.text);
        root.style.setProperty('--text-sub', cfg.text + '99');
        root.style.setProperty('--border-color', cfg.text + '26');
        root.style.setProperty('--progress-bg', cfg.text + '33');
        root.style.setProperty('--divider', cfg.text + '1a');
      } else {
        root.style.removeProperty('--bg-card');
        root.style.removeProperty('--text-main');
        root.style.removeProperty('--text-sub');
        root.style.removeProperty('--border-color');
        root.style.removeProperty('--progress-bg');
        root.style.removeProperty('--divider');
      }
    }

    let config = getActiveConfig();
    applyConfig(config);

    function bindColorPair(pickerId, hexId) {
      const p = document.getElementById(pickerId);
      const h = document.getElementById(hexId);
      p.addEventListener('input', () => h.value = p.value);
      h.addEventListener('input', () => {
        if (/^#[0-9A-Fa-f]{6}$/.test(h.value)) p.value = h.value;
      });
    }
    bindColorPair('pickerBg', 'hexBg');
    bindColorPair('pickerText', 'hexText');

    // Audio Controls
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const heartBtn = document.getElementById('heartBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    let isPlaying = false;
    let timer = 3;

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        isPlaying = false;
      } else {
        audio.play().catch(() => {});
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
        isPlaying = true;
      }
    });

    setInterval(() => {
      if (isPlaying) {
        timer++;
        const mins = Math.floor(timer / 60);
        const secs = String(timer % 60).padStart(2, '0');
        currentTimeEl.textContent = `${mins}:${secs}`;
        progressFill.style.width = Math.min(100, (timer / 180) * 100) + '%';
      }
    }, 1000);

    heartBtn.addEventListener('click', () => heartBtn.classList.toggle('liked'));

    function switchTrack(title, artist) {
      document.getElementById('songTitle').textContent = title;
      document.getElementById('artistName').textContent = artist;
      timer = 0;
      if (!isPlaying) playBtn.click();
    }

    // Modal Logic
    const modal = document.getElementById('settingsModal');
    document.getElementById('openSettingsBtn').addEventListener('click', () => {
      document.getElementById('inputSpotifyUrl').value = config.spotifyUrl || '';
      document.getElementById('inputSongTitle').value = config.title || '';
      document.getElementById('inputArtistName').value = config.artist || '';
      document.getElementById('inputCoverUrl').value = config.cover || '';
      const bg = config.bg || '#121212';
      const text = config.text || '#ffffff';
      document.getElementById('pickerBg').value = bg;
      document.getElementById('hexBg').value = bg;
      document.getElementById('pickerText').value = text;
      document.getElementById('hexText').value = text;
      modal.classList.add('active');
    });

    document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.remove('active'));

    document.getElementById('saveBtn').addEventListener('click', () => {
      config = {
        spotifyUrl: document.getElementById('inputSpotifyUrl').value.trim() || DEFAULTS.spotifyUrl,
        title: document.getElementById('inputSongTitle').value.trim() || DEFAULTS.title,
        artist: document.getElementById('inputArtistName').value.trim() || DEFAULTS.artist,
        cover: document.getElementById('inputCoverUrl').value.trim() || DEFAULTS.cover,
        bg: normalizeHex(document.getElementById('hexBg').value) || '#121212',
        text: normalizeHex(document.getElementById('hexText').value) || '#ffffff'
      };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch (e) {}
      applyConfig(config);
      modal.classList.remove('active');
    });

    document.getElementById('copyUrlBtn').addEventListener('click', () => {
      const params = new URLSearchParams();
      const bg = (normalizeHex(document.getElementById('hexBg').value) || '#121212').replace('#', '');
      const text = (normalizeHex(document.getElementById('hexText').value) || '#ffffff').replace('#', '');
      params.set('bg', bg);
      params.set('text', text);

      const sp = document.getElementById('inputSpotifyUrl').value.trim();
      const ti = document.getElementById('inputSongTitle').value.trim();
      const ar = document.getElementById('inputArtistName').value.trim();
      const co = document.getElementById('inputCoverUrl').value.trim();
      if (sp && sp !== DEFAULTS.spotifyUrl) params.set('spotify', sp);
      if (ti && ti !== DEFAULTS.title) params.set('title', ti);
      if (ar && ar !== DEFAULTS.artist) params.set('artist', ar);
      if (co && co !== DEFAULTS.cover) params.set('cover', co);

      const fullUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
      navigator.clipboard.writeText(fullUrl);
      const btn = document.getElementById('copyUrlBtn');
      btn.textContent = '✓ Copied URL!';
      setTimeout(() => btn.textContent = '📋 Copy Template URL', 1800);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      config = getActiveConfig();
      config.bg = null;
      config.text = null;
      applyConfig(config);
      modal.classList.remove('active');
    });
  </script>
</body>
</html>
