<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Date Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .date-card {
      width: 110px;
      height: 125px;
      border: 1.5px solid #222222;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px;
      text-align: center;
    }
    .day-name {
      font-family: 'Inter', sans-serif;
      font-size: 8.5px;
      letter-spacing: 2.5px;
      font-weight: 500;
      color: #7b2929;
      text-transform: uppercase;
    }
    .day-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 50px;
      line-height: 0.95;
      font-weight: 500;
      color: #7b2929;
    }
    .month-year {
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      font-weight: 600;
      color: #7b2929;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="date-card">
    <div id="day-name" class="day-name">---</div>
    <div id="day-number" class="day-number">--</div>
    <div id="month-year" class="month-year">--- ----</div>
  </div>

  <script>
    const now = new Date();
    
    // Day of week
    const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    document.getElementById('day-name').textContent = days[now.getDay()];

    // Day of month (e.g. 14)
    document.getElementById('day-number').textContent = now.getDate();

    // Month & Year (e.g. OCT 2026)
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const month = months[now.getMonth()];
    const year = now.getFullYear();
    document.getElementById('month-year').textContent = `${month} ${year}`;
  </script>
</body>
</html>
