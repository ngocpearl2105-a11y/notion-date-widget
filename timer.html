<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Focus Timer</title>

  <!-- OEMBED & PLAYER METADATA FOR NOTION / IFRAMELY -->
  <link rel="alternate" type="application/json+oembed" href="https://ngocpearl2105-a11y.github.io/notion-date-widget/timer-oembed.json" title="Notion Focus Timer" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Notion Focus Timer" />
  <meta name="twitter:card" content="player" />
  <meta name="twitter:title" content="Notion Focus Timer" />
  <meta name="twitter:player" content="https://ngocpearl2105-a11y.github.io/notion-date-widget/timer.html" />
  <meta name="twitter:player:width" content="340" />
  <meta name="twitter:player:height" content="460" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    /* DEFAULT RESPONSIVE THEME (No shadow, clean border) */
    :root {
      /* Light Mode Default: Black card, White text & accents */
      --bg-card: #0d0d0d;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
      --border-color: rgba(0, 0, 0, 0.15);
      --pill-bg: rgba(255, 255, 255, 0.08);
      --pill-hover: rgba(255, 255, 255, 0.14);
      --accent-bg: #ffffff;
      --accent-text: #0d0d0d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Default: White card, Black text & accents */
        --bg-card: #ffffff;
        --text-main: #0d0d0d;
        --text-sub: rgba(13, 13, 13, 0.55);
        --border-color: rgba(255, 255, 255, 0.2);
        --pill-bg: rgba(0, 0, 0, 0.05);
        --pill-hover: rgba(0, 0, 0, 0.1);
        --accent-bg: #0d0d0d;
        --accent-text: #ffffff;
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 4px;
      overflow: hidden;
    }

    .timer-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: inline-size;
    }

    /* NO SHADOW - BORDER ONLY */
    .timer-card {
      position: relative;
      width: 100%;
      max-width: 320px;
      background: var(--bg-card);
      border-radius: clamp(14px, 5cqw, 24px);
      border: 1px solid var(--border-color);
      box-shadow: none !important;
      padding: clamp(14px, 5cqw, 24px) clamp(16px, 6cqw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 3.5cqw, 16px);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    /* Settings Gear Button (Shows on hover) */
    .settings-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 26px;
      height: 26px;
      background: var(--pill-bg);
      border-radius: 50%;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .timer-card:hover .settings-btn { opacity: 1; }
    .settings-btn:hover { transform: scale(1.1); background: var(--pill-hover); }

    .header-label {
      font-size: clamp(9px, 3cqw, 11px);
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .timer-display {
      font-size: clamp(46px, 18cqw, 72px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-main);
      margin: 2px 0;
      font-variant-numeric: tabular-nums;
      transition: color 0.25s ease;
    }

    .section-label {
      font-size: clamp(8px, 2.8cqw, 10px);
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: -4px;
    }

    .stepper-pill {
      width: 100%;
      max-width: 250px;
      height: clamp(34px, 10cqw, 40px);
      background: var(--pill-bg);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border: 1px solid var(--border-color);
    }

    .stepper-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:hover { background: var(--pill-hover); }
    .stepper-btn:active { transform: scale(0.9); }

    .stepper-value {
      font-size: clamp(11px, 3.6cqw, 13px);
      font-weight: 600;
      color: var(--text-main);
    }

    .presets-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.8cqw, 8px);
      width: 100%;
    }

    .preset-chip {
      width: clamp(32px, 9.5cqw, 38px);
      height: clamp(32px, 9.5cqw, 38px);
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--pill-bg);
      color: var(--text-main);
      font-size: clamp(11px, 3.4cqw, 12px);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .preset-chip:hover { background: var(--pill-hover); }
    .preset-chip.active {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-bg);
    }

    .actions-group {
      width: 100%;
      max-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-primary {
      width: 100%;
      height: clamp(36px, 11cqw, 42px);
      border-radius: 999px;
      border: none;
      background: var(--accent-bg);
      color: var(--accent-text);
      font-size: clamp(12px, 3.8cqw, 13px);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:active { transform: scale(0.98); }

    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .btn-secondary {
      height: clamp(32px, 9.5cqw, 36px);
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--pill-bg);
      color: var(--text-main);
      font-size: clamp(11px, 3.4cqw, 12px);
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-secondary:hover { background: var(--pill-hover); }

    .quote-footer {
      font-size: clamp(7.5px, 2.4cqw, 9px);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-sub);
      text-transform: uppercase;
      text-align: center;
      line-height: 1.4;
      margin-top: 2px;
    }

    /* SETTINGS MODAL */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 18, 0.98);
      backdrop-filter: blur(8px);
      border-radius: clamp(14px, 5cqw, 24px);
      z-index: 100;
      padding: 16px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }
    .modal-overlay.active { display: flex; }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
    }
    .modal-title { font-size: 13px; font-weight: 700; }
    .close-btn { background: none; border: none; color: #a7a7a7; font-size: 18px; cursor: pointer; }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }
    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .color-row label { font-size: 11px; font-weight: 600; color: #cccccc; }
    .color-inputs { display: flex; align-items: center; gap: 6px; }
    .color-inputs input[type="color"] {
      width: 24px; height: 24px; border: none; background: none; cursor: pointer;
    }
    .color-inputs input[type="text"] {
      width: 76px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 5px;
      color: #fff;
      padding: 4px 6px;
      font-size: 11px;
      font-family: monospace;
    }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 8px;
      gap: 6px;
    }
    .btn-group { display: flex; gap: 5px; }
    .btn-action {
      border: none;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save { background: #ffffff; color: #000000; }
    .btn-copy { background: #333333; color: #ffffff; border: 1px solid #555; }
    .btn-reset { background: none; color: #e05656; border: none; font-size: 10.5px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="timer-container">
    <div class="timer-card">
      <button class="settings-btn" id="openSettingsBtn" title="Customize Timer Colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>

      <div class="header-label">Focus Timer</div>

      <div class="timer-display" id="timeDisplay">45:00</div>

      <div class="section-label">Session Length</div>

      <div class="stepper-pill">
        <button class="stepper-btn" id="btnMinus" title="Decrease 5 min">−</button>
        <span class="stepper-value" id="stepperVal">45 min</span>
        <button class="stepper-btn" id="btnPlus" title="Increase 5 min">+</button>
      </div>

      <div class="presets-row">
        <button class="preset-chip" data-time="15">15</button>
        <button class="preset-chip" data-time="25">25</button>
        <button class="preset-chip active" data-time="45">45</button>
        <button class="preset-chip" data-time="60">60</button>
        <button class="preset-chip" data-time="90">90</button>
      </div>

      <div class="actions-group">
        <button class="btn-primary" id="btnStart">
          <span id="startIcon">▶</span> <span id="startText">Start</span>
        </button>
        <div class="secondary-row">
          <button class="btn-secondary" id="btnPause">Pause</button>
          <button class="btn-secondary" id="btnReset">Reset</button>
        </div>
      </div>

      <div class="quote-footer">
        Focus on progress, not perfection.
      </div>

      <!-- Settings Modal -->
      <div class="modal-overlay" id="settingsModal">
        <div class="modal-header">
          <div class="modal-title">⚙️ Timer Color Settings</div>
          <button class="close-btn" id="closeSettingsBtn">✕</button>
        </div>
        <div class="modal-body">
          <div class="color-row">
            <label>Card Background:</label>
            <div class="color-inputs">
              <input type="color" id="pickerBg" value="#0d0d0d">
              <input type="text" id="hexBg" value="#0d0d0d" maxlength="7">
            </div>
          </div>
          <div class="color-row">
            <label>Text & Numbers:</label>
            <div class="color-inputs">
              <input type="color" id="pickerText" value="#ffffff">
              <input type="text" id="hexText" value="#ffffff" maxlength="7">
            </div>
          </div>
          <div class="color-row">
            <label>Start Button / Accent:</label>
            <div class="color-inputs">
              <input type="color" id="pickerAccent" value="#ffffff">
              <input type="text" id="hexAccent" value="#ffffff" maxlength="7">
            </div>
          </div>
          <div class="color-row">
            <label>Border Color:</label>
            <div class="color-inputs">
              <input type="color" id="pickerBorder" value="#262626">
              <input type="text" id="hexBorder" value="#262626" maxlength="7">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-reset" id="resetBtn">Auto Responsive</button>
          <div class="btn-group">
            <button class="btn-action btn-copy" id="copyUrlBtn" title="Copy URL with colors for Notion Template">📋 Copy Template URL</button>
            <button class="btn-action btn-save" id="saveBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'notion_focus_timer_theme_v1';
    const urlParams = new URLSearchParams(window.location.search);

    function normalizeHex(val) {
      if (!val) return null;
      val = val.trim().replace(/^#/, '');
      if (/^[0-9A-Fa-f]{6}$/.test(val)) return '#' + val;
      return null;
    }

    function loadTheme() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

      const urlBg = normalizeHex(urlParams.get('bg'));
      const urlText = normalizeHex(urlParams.get('text'));
      const urlAccent = normalizeHex(urlParams.get('accent'));
      const urlBorder = normalizeHex(urlParams.get('border'));

      const active = saved || ((urlBg || urlText) ? {
        bg: urlBg || '#0d0d0d',
        text: urlText || '#ffffff',
        accent: urlAccent || urlText || '#ffffff',
        border: urlBorder
      } : null);

      const root = document.documentElement;
      if (active && active.bg && active.text) {
        root.style.setProperty('--bg-card', active.bg);
        root.style.setProperty('--text-main', active.text);
        root.style.setProperty('--text-sub', active.text + '99');
        root.style.setProperty('--border-color', active.border || active.text + '26');
        root.style.setProperty('--pill-bg', active.text + '12');
        root.style.setProperty('--pill-hover', active.text + '22');
        root.style.setProperty('--accent-bg', active.accent || active.text);
        root.style.setProperty('--accent-text', active.bg);
        return active;
      } else {
        root.style.removeProperty('--bg-card');
        root.style.removeProperty('--text-main');
        root.style.removeProperty('--text-sub');
        root.style.removeProperty('--border-color');
        root.style.removeProperty('--pill-bg');
        root.style.removeProperty('--pill-hover');
        root.style.removeProperty('--accent-bg');
        root.style.removeProperty('--accent-text');
        return null;
      }
    }

    let currentTheme = loadTheme();

    function bindColorPair(pickerId, hexId) {
      const p = document.getElementById(pickerId);
      const h = document.getElementById(hexId);
      p.addEventListener('input', () => h.value = p.value);
      h.addEventListener('input', () => {
        if (/^#[0-9A-Fa-f]{6}$/.test(h.value)) p.value = h.value;
      });
    }
    bindColorPair('pickerBg', 'hexBg');
    bindColorPair('pickerText', 'hexText');
    bindColorPair('pickerAccent', 'hexAccent');
    bindColorPair('pickerBorder', 'hexBorder');

    const modal = document.getElementById('settingsModal');
    document.getElementById('openSettingsBtn').addEventListener('click', () => {
      const bg = (currentTheme && currentTheme.bg) || '#0d0d0d';
      const text = (currentTheme && currentTheme.text) || '#ffffff';
      const accent = (currentTheme && currentTheme.accent) || '#ffffff';
      const border = (currentTheme && currentTheme.border) || '#262626';

      document.getElementById('pickerBg').value = bg;
      document.getElementById('hexBg').value = bg;
      document.getElementById('pickerText').value = text;
      document.getElementById('hexText').value = text;
      document.getElementById('pickerAccent').value = accent;
      document.getElementById('hexAccent').value = accent;
      document.getElementById('pickerBorder').value = border;
      document.getElementById('hexBorder').value = border;
      modal.classList.add('active');
    });

    document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.remove('active'));

    document.getElementById('saveBtn').addEventListener('click', () => {
      const cfg = {
        bg: normalizeHex(document.getElementById('hexBg').value) || '#0d0d0d',
        text: normalizeHex(document.getElementById('hexText').value) || '#ffffff',
        accent: normalizeHex(document.getElementById('hexAccent').value) || '#ffffff',
        border: normalizeHex(document.getElementById('hexBorder').value) || '#262626'
      };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
      currentTheme = loadTheme();
      modal.classList.remove('active');
    });

    document.getElementById('copyUrlBtn').addEventListener('click', () => {
      const bg = (normalizeHex(document.getElementById('hexBg').value) || '#0d0d0d').replace('#', '');
      const text = (normalizeHex(document.getElementById('hexText').value) || '#ffffff').replace('#', '');
      const accent = (normalizeHex(document.getElementById('hexAccent').value) || '#ffffff').replace('#', '');
      const border = (normalizeHex(document.getElementById('hexBorder').value) || '#262626').replace('#', '');
      const baseUrl = window.location.origin + window.location.pathname;
      const fullUrl = `${baseUrl}?bg=${bg}&text=${text}&accent=${accent}&border=${border}`;
      navigator.clipboard.writeText(fullUrl);
      const btn = document.getElementById('copyUrlBtn');
      btn.textContent = '✓ Copied URL!';
      setTimeout(() => btn.textContent = '📋 Copy Template URL', 1800);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      currentTheme = loadTheme();
      modal.classList.remove('active');
    });

    // Timer Logic
    let sessionMinutes = 45;
    let totalSeconds = 45 * 60;
    let timerInterval = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('timeDisplay');
    const stepperVal = document.getElementById('stepperVal');
    const btnStart = document.getElementById('btnStart');
    const startIcon = document.getElementById('startIcon');
    const startText = document.getElementById('startText');
    const btnPause = document.getElementById('btnPause');
    const btnReset = document.getElementById('btnReset');
    const btnMinus = document.getElementById('btnMinus');
    const btnPlus = document.getElementById('btnPlus');
    const presetChips = document.querySelectorAll('.preset-chip');

    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {}
    }

    function renderDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateSession(minutes) {
      if (isRunning) pauseTimer();
      sessionMinutes = Math.max(1, Math.min(180, minutes));
      totalSeconds = sessionMinutes * 60;
      stepperVal.textContent = `${sessionMinutes} min`;
      renderDisplay();
      presetChips.forEach(chip => {
        chip.classList.toggle('active', parseInt(chip.dataset.time) === sessionMinutes);
      });
    }

    function startTimer() {
      if (isRunning) return;
      if (totalSeconds <= 0) totalSeconds = sessionMinutes * 60;
      isRunning = true;
      startText.textContent = 'Running';
      startIcon.textContent = '●';
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          renderDisplay();
        } else {
          pauseTimer();
          playChime();
          startText.textContent = 'Finished!';
          startIcon.textContent = '✓';
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      startText.textContent = 'Start';
      startIcon.textContent = '▶';
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = sessionMinutes * 60;
      renderDisplay();
    }

    btnStart.addEventListener('click', () => { if (!isRunning) startTimer(); });
    btnPause.addEventListener('click', pauseTimer);
    btnReset.addEventListener('click', resetTimer);
    btnMinus.addEventListener('click', () => updateSession(sessionMinutes - 5));
    btnPlus.addEventListener('click', () => updateSession(sessionMinutes + 5));
    presetChips.forEach(chip => {
      chip.addEventListener('click', () => updateSession(parseInt(chip.dataset.time)));
    });

    renderDisplay();
  </script>
</body>
</html>
